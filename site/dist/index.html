    <script>
      // Dynamically set favicon so dev and GH Pages (repo subpath) both resolve correctly.
      (function() {
        try {
          var path = '/favicon.ico';
          // If app is served under a subpath (e.g., /gh-open-dash/), try that first on GH Pages
          var base = window.location.pathname.split('/').filter(Boolean)[0];
          if (base) {
            var candidate = '/' + base + '/favicon.ico';
            // create element and test by attempting to load via Image
            var img = new Image();
            img.onload = function() { setHref(candidate); };
            img.onerror = function() { setHref('/favicon.ico'); };
            img.src = candidate;
            return;
          }
        } catch (e) {
          // fallback
        }
        function setHref(h) {
          var link = document.createElement('link');
          link.rel = 'icon';
          link.href = h;
          document.head.appendChild(link);
        }
      })();
    </script>
