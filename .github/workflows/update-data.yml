name: Update participation data

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reprocess_from_week:
        description: "ISO Monday date (YYYY-MM-DD) to restart processing from"
        required: false
        # default removed: use the helper script or provide a date when running
      reprocess_weeks:
        description: "Number of full weeks to reprocess from the last complete week"
        required: false
        default: "52"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite database
        uses: actions/cache@v5
        with:
          path: |
            data/participation.sqlite
            data/participation.sqlite-wal
            data/participation.sqlite-shm
          # Use a simple rolling key or run_id that restores from the latest available
          key: participation-data-${{ github.week_number }}
          restore-keys: |
            participation-data-

      - name: Write staff allowlist from secret (or empty)
        run: |
          if [ -z "${STAFF_ALLOWLIST_JSON}" ]; then
            echo "STAFF_ALLOWLIST_JSON not set; writing empty list" >&2
            echo "[]" > scripts/staff_allowlist.json
          else
            printf '%s\n' "${STAFF_ALLOWLIST_JSON}" > scripts/staff_allowlist.json
          fi
        env:
          STAFF_ALLOWLIST_JSON: ${{ secrets.STAFF_ALLOWLIST_JSON }}

      - name: Update SQLite
        run: node scripts/update_sqlite.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READ_ORG_TOKEN || secrets.GITHUB_TOKEN }}
          ORG_ALLOWLIST: ${{ vars.ORG_ALLOWLIST || 'civicactions' }}
          HISTORY_WEEKS: ${{ vars.HISTORY_WEEKS || 260 }}
          # Increase default max weeks to 12 to match config.json and allow faster backfilling
          MAX_WEEKS_PER_RUN: ${{ vars.MAX_WEEKS_PER_RUN || 12 }}
          REPROCESS_FROM_WEEK: ${{ inputs.reprocess_from_week || vars.REPROCESS_FROM_WEEK || '' }}
          REPROCESS_WEEKS: ${{ inputs.reprocess_weeks || vars.REPROCESS_WEEKS || '' }}

      - name: Export Metrics
        run: node scripts/export_metrics.mjs
        env:
          ORG_ALLOWLIST: ${{ vars.ORG_ALLOWLIST || 'civicactions' }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit the exported metrics JSON; DB files are intentionally gitignored
          git add data/metrics.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update participation data"
          # Retry push with rebase in case another commit landed on the remote
          for i in 1 2 3; do
            if git pull --rebase --autostash origin HEAD && git push origin HEAD; then
              exit 0
            fi
            echo "Push attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "All push attempts failed after 3 retries"
          exit 1
