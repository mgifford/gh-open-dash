name: Update metrics

on:
  schedule:
    - cron: '0 6 * * 1' # weekly on Monday UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # allow pushing back to the repo
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies
        run: |
          npm ci

      - name: Update SQLite (collect week buckets)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_WEEKS_PER_RUN: 0
        run: |
          node scripts/update_sqlite.mjs || true

      - name: Export metrics.json (includes per-repo aggregates)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          node scripts/export_metrics.mjs 2>&1 | tee logs/export_metrics.log
          echo "${PIPESTATUS[0]}" > logs/export_metrics.exit

      - name: Upload export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-debug
          path: |
            logs/export_metrics.log
            logs/export_metrics.exit
            data/participation.sqlite
            data/participation.sqlite-wal
            data/participation.sqlite-shm
            data/metrics.json

      - name: Fail if export_metrics failed
        if: always()
        run: |
          if [ -f logs/export_metrics.exit ] && [ "$(cat logs/export_metrics.exit)" -ne 0 ]; then
            echo "export_metrics failed; see 'export-debug' artifact for logs and DB" >&2
            exit 1
          fi

      - name: Copy metrics into site public
        run: |
          node scripts/copy_metrics_to_site.mjs || true

      - name: Build site
        run: |
          cd site
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: site/dist
