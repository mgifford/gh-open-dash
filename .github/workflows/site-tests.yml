name: Site tests

on:
  push:
    paths:
      - 'site/**'
  pull_request:
    paths:
      - 'site/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          cd site
          npm ci
      - name: Run tests
        run: |
          cd site
          npm test --silent
