name: Update Comments

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update-comments:
    runs-on: ubuntu-latest
    concurrency:
      group: update-comments
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite database
        uses: actions/cache@v5
        with:
          path: |
            data/participation.sqlite
            data/participation.sqlite-wal
            data/participation.sqlite-shm
          key: sqlite-db-${{ github.run_id }}
          restore-keys: |
            sqlite-db-

      - name: Ensure DB schema (create tables)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run schema-only (do not process weeks) to avoid re-collecting PR/issue data
          MAX_WEEKS_PER_RUN: 0
        run: |
          node scripts/update_sqlite.mjs || true


      - name: Run comments update
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_WEEKS_PER_RUN: ${{ vars.MAX_WEEKS_PER_RUN || 4 }}
        run: |
          set -o pipefail
          mkdir -p logs
          node scripts/update_comments.mjs 2>&1 | tee logs/update_comments.log
          echo "${PIPESTATUS[0]}" > logs/update_comments.exit

      - name: Upload comments artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comments-debug
          path: |
            logs/update_comments.log
            logs/update_comments.exit
            data/participation.sqlite
            data/participation.sqlite-wal
            data/participation.sqlite-shm
            data/metrics.json

      - name: Fail if comments job failed or exit code missing
        if: always()
        run: |
          if [ ! -f logs/update_comments.exit ]; then
            echo "update_comments did not produce exit file; failing to prevent downstream steps" >&2
            ls -la logs || true
            exit 1
          fi
          if [ "$(cat logs/update_comments.exit)" -ne 0 ]; then
            echo "update_comments failed; see 'comments-debug' artifact for logs and DB" >&2
            exit 1
          fi
