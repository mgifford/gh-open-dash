name: Scan Organization from Issue

run-name: "Scan org: ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

# Prevent parallel scan jobs from conflicting on the git push step.
# Queue additional scan requests rather than cancelling them.
concurrency:
  group: scan-org
  cancel-in-progress: false

jobs:
  parse-title:
    runs-on: ubuntu-latest
    outputs:
      is-scan: ${{ steps.check.outputs.is-scan }}
      org: ${{ steps.parse.outputs.org }}
    steps:
      - name: Check if title starts with SCAN
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if echo "$ISSUE_TITLE" | grep -qiE '^SCAN[[:space:]]*:'; then
            echo "is-scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-scan=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse org name from title
        id: parse
        if: steps.check.outputs.is-scan == 'true'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Strip the "SCAN:" prefix (case-insensitive) and surrounding whitespace
          ORG=$(printf '%s' "$ISSUE_TITLE" | sed 's/^[Ss][Cc][Aa][Nn][[:space:]]*://; s/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')
          # Validate: must start with alphanumeric, only letters/numbers/hyphens/underscores
          if echo "$ORG" | grep -qE '^[a-z0-9][a-z0-9_-]*$'; then
            echo "org=$ORG" >> "$GITHUB_OUTPUT"
          else
            echo "org=" >> "$GITHUB_OUTPUT"
          fi

  comment-invalid:
    needs: parse-title
    if: needs.parse-title.outputs.is-scan == 'true' && needs.parse-title.outputs.org == ''
    runs-on: ubuntu-latest
    steps:
      - name: Comment with instructions for invalid org name
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '❌ Could not parse a valid organization name from this issue title.',
                '',
                'Please rename the issue using the format:',
                '```',
                'SCAN: orgname',
                '```',
                'Where `orgname` is a valid GitHub organization handle (letters, numbers, hyphens, and underscores only).',
                '',
                'Example: `SCAN: civicactions`'
              ].join('\n')
            });

  scan-org:
    needs: parse-title
    if: needs.parse-title.outputs.is-scan == 'true' && needs.parse-title.outputs.org != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite database
        uses: actions/cache@v5
        with:
          path: |
            data/participation.sqlite
            data/participation.sqlite-wal
            data/participation.sqlite-shm
          key: participation-data-${{ github.run_id }}
          restore-keys: |
            participation-data-

      - name: Write staff allowlist from secret (or empty)
        run: |
          if [ -z "${STAFF_ALLOWLIST_JSON}" ]; then
            echo "STAFF_ALLOWLIST_JSON not set; writing empty list" >&2
            echo "[]" > scripts/staff_allowlist.json
          else
            printf '%s\n' "${STAFF_ALLOWLIST_JSON}" > scripts/staff_allowlist.json
          fi
        env:
          STAFF_ALLOWLIST_JSON: ${{ secrets.STAFF_ALLOWLIST_JSON }}

      - name: Add org to scripts/config.json allowlist
        env:
          NEW_ORG: ${{ needs.parse-title.outputs.org }}
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('scripts/config.json', 'utf8'));
          const org = process.env.NEW_ORG;
          if (!config.orgAllowlist.includes(org)) {
            config.orgAllowlist.push(org);
            fs.writeFileSync('scripts/config.json', JSON.stringify(config, null, 2) + '\n');
            console.log('Added ' + org + ' to orgAllowlist');
          } else {
            console.log(org + ' is already in orgAllowlist — no config change needed');
          }
          "

      - name: Collect data for requested org
        # ORG_ALLOWLIST intentionally not set here: scripts/config.json was
        # just updated above to include the new org, so both scripts read it
        # directly as their single source of truth (see update-metrics.yml
        # for why a separate ORG_ALLOWLIST variable caused orgs to be
        # silently dropped from scheduled collection).
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READ_ORG_TOKEN || secrets.GITHUB_TOKEN }}
          HISTORY_WEEKS: ${{ vars.HISTORY_WEEKS || 52 }}
          MAX_WEEKS_PER_RUN: ${{ vars.MAX_WEEKS_PER_RUN || 4 }}
        run: node scripts/update_sqlite.mjs

      - name: Export metrics
        run: node scripts/export_metrics.mjs

      - name: Commit updated config and metrics
        env:
          SCAN_ORG: ${{ needs.parse-title.outputs.org }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/config.json data/metrics.json
          git diff --staged --quiet || git commit -m "Scan org: ${SCAN_ORG} (issue #${ISSUE_NUMBER})"
          # Retry push with rebase in case another commit landed on the remote during this long-running scan
          for i in 1 2 3; do
            if git pull --rebase --autostash origin HEAD && git push origin HEAD; then
              exit 0
            fi
            echo "Push attempt $i failed; retrying in 10s..."
            sleep 10
          done
          echo "All push attempts failed after 3 retries"
          exit 1

      - name: Comment success on issue
        uses: actions/github-script@v9
        env:
          SCAN_ORG: ${{ needs.parse-title.outputs.org }}
        with:
          script: |
            const org = process.env.SCAN_ORG;
            const repoHomepage = context.payload.repository.homepage;
            const dashUrl = repoHomepage
              ? `${repoHomepage.replace(/\/$/, '')}/?org=${org}`
              : null;
            const lines = [
              `✅ Data collection for **${org}** has been initiated.`,
              '',
              '**What happened:**',
              `- \`${org}\` was added to the data pipeline allowlist in \`scripts/config.json\``,
              '- The first 4 weeks of metrics were collected and exported to `data/metrics.json`',
              '- The changes have been committed to this repository',
              '',
              '**Ongoing collection:**',
              `> The weekly scheduled run will automatically backfill the remaining history for \`${org}\` in small batches (up to 4 weeks per run). Full history will be available after a few weekly runs.`,
            ];
            if (dashUrl) {
              lines.push('');
              lines.push(`**View the dashboard:** [${dashUrl}](${dashUrl})`);
            }
            lines.push('');
            lines.push(`> **Note:** \`${org}\` will now be included in all future weekly data collection runs.`);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });
            // Close the issue now that the scan is complete
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              state_reason: 'completed'
            });
